name: Version policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request and base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require a version bump for behavior changes
        run: node scripts/check-version-bump.mjs
      - name: Run compiler regression tests
        run: node --test compiler/unico-ir-compiler.test.mjs
